[package]
name = "compile-triton"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "Lower kernel IR terms to Triton source (ADR-0165)"
repository = "https://github.com/handl-lang/engine-compile-triton"
readme = "README.md"
keywords = ["handl", "triton", "gpu", "compiler"]
categories = ["compilers", "science"]

[lib]
name = "compile_triton"
path = "src/lib.rs"

[[bin]]
name = "compile-triton"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde_json = "1"
