[package]
name = "compile-triton"
version = "0.0.1"
edition = "2024"
license = "MIT"
description = "Lower kernel IR terms to Triton source (ADR-0165)"
repository = "https://github.com/handl-lang/tool-compile-triton"
readme = "README.md"
keywords = ["handl", "triton", "gpu", "compiler"]
categories = ["compilers", "science"]
# Git-install only: https://github.com/handl-lang/tool-compile-triton (no crates.io).
publish = false

[lib]
name = "compile_triton"
path = "src/lib.rs"

[[bin]]
name = "compile-triton"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Desired-state kernel: `KernelTerm` implements `IrModule` and
# `TritonEmitter` implements `Emitter<KernelTerm>` over it (PL-004
# T-094). Git dep — the sibling checkout wins via `[patch]`.
hnl-tool-codegen = { git = "https://github.com/handl-lang/tool-codegen", branch = "main" }

[dev-dependencies]
serde_json = "1"

# ADR-0128 §Resolution: the sibling checkout wins locally; CI resolves
# the `branch = "main"` git deps.
[patch."https://github.com/handl-lang/tool-codegen"]
hnl-tool-codegen = { path = "../tool-codegen" }
